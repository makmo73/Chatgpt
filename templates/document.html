<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: Helvetica, Arial, sans-serif; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 4px; }
  </style>
</head>
<body>
  <h1>{{ title }}</h1>
  <table>
    <thead>
      <tr><th>Pagina</th><th>Testo Estratto</th></tr>
    </thead>
    <tbody>
      {% for page in pages %}
      <tr>
        <td>{{ page.number }}</td>
        <td>{{ page.text }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
