version: "3.9"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ocruser
      POSTGRES_PASSWORD: ocrpass
      POSTGRES_DB: ocrdb
    volumes:
      - db_data:/var/lib/postgresql/data
  redis:
    image: redis:7
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://ocruser:ocrpass@db:5432/ocrdb
      REDIS_URL: redis://redis:6379/0
      STORAGE_PATH: /data
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS}
    depends_on:
      - db
      - redis
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
volumes:
  db_data:
